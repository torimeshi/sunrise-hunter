name: Sunrise Cancel Hunter

on:
  schedule:
    # 日本時間 5:20〜8:55 (UTC 20:20〜23:55)
    - cron: '*/5 20-23 * * *'
    # 日本時間 9:00〜23:55 (UTC 0:00〜14:55)
    - cron: '*/5 0-14 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [form_submitted]

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ⚡️ [超速チェック] ブラウザをDLする前に日付を確認（わずか2〜3秒で完了）
      - name: Check Target Date
        id: check_date
        env:
          CONFIG_CSV_URL: ${{ secrets.CONFIG_CSV_URL }}
        run: |
          pip install requests
          python -c '
          import os, sys, csv, requests
          from datetime import datetime, timezone, timedelta

          url = os.environ.get("CONFIG_CSV_URL")
          res = requests.get(url, timeout=10)
          lines = res.text.splitlines()
          reader = list(csv.reader(lines))
          if len(reader) < 2:
              print("IS_PAST=true")
              sys.exit(0)

          latest = reader[-1]
          raw_date = latest[1].replace("/", "-").strip()
          parts = raw_date.split("-")
          jst = timezone(timedelta(hours=9))
          now_jst = datetime.now(jst)

          if len(parts) == 3:
              y, m, d = int(parts[0]), int(parts[1]), int(parts[2])
          elif len(parts) == 2:
              y, m, d = now_jst.year, int(parts[0]), int(parts[1])
          else:
              print("IS_PAST=true")
              sys.exit(0)

          target_midnight = datetime(y, m, d, 23, 59, 59, tzinfo=jst)
          if target_midnight < now_jst:
              print("🛑 過去日付のためスキップします。")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("is_past=true\n")
          else:
              print("✅ 有効な日付です。監視を継続します。")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("is_past=false\n")
          '

      # 📦 有効な日付のときだけブラウザをインストール（過去日ならスキップ！）
      - name: Install dependencies
        if: steps.check_date.outputs.is_past == 'false'
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium

      # 🚀 有効な日付のときだけハンターを実行
      - name: Run Hunter
        if: steps.check_date.outputs.is_past == 'false'
        env:
          CONFIG_CSV_URL: ${{ secrets.CONFIG_CSV_URL }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python sunrise_hunter.py

      # 📸 デバッグ用スクショ保存
      - name: Upload Debug Screenshots
        if: steps.check_date.outputs.is_past == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          if-no-files-found: ignore
