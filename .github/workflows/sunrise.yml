name: Sunrise Cancel Hunter (Stealth)

on:
  schedule:
    # 💡 日本時間 5:20〜8:55 (UTC 20:20〜23:55)
    - cron: '*/5 20-23 * * *'
    # 💡 日本時間 9:00〜23:55 (UTC 0:00〜14:55)
    - cron: '*/5 0-14 * * *'
  workflow_dispatch: # 手動実行用ボタン

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright beautifulsoup4
        playwright install chromium

    - name: Run Hunter
      env:
        # 🔗 とりめしさんのスプレッドシートCSVリンク（セットアップ済み！）
        CONFIG_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSX12jD6ygnA3WdGUMVzaXQBMyAXJdzPOdVFv4JVTUamVSyhxn8TZHiZL1sTwDJ3xut1Up1m7AGWHSK/pub?gid=2106773244&single=true&output=csv"
        # 🔑 LINE通知用の宛先（前回のLINEボットの鍵を設定済み！）
        LINE_ACCESS_TOKEN: "ddkFcNw/DhH5nfiUkVzCRCJsmasDQ1zUwi9clTGX7B0aO2u2ftDpSDL+bPcc5tDbiB2cGRKdZqTlFJ3M5U8XkvrLnd1n2Drw1/wiS6PzTpM3XS1buteOBGbQO+HUVRUHHYVfJCOxnXsZX4CU1kcDGQdB04t89/1O/w1cDnyilFU="
        LINE_USER_ID: "Ub1d15b78b0898bc8423f8cebe68ad1fa"
        LINE_GROUP_ID: ""
      run: python sunrise_hunter.py
