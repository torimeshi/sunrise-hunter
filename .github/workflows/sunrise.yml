name: Sunrise Cancel Hunter

on:
  schedule:
    # 日本時間 5:20〜8:55 (UTC 20:20〜23:55)
    - cron: '*/5 20-23 * * *'
    # 日本時間 9:00〜23:55 (UTC 0:00〜14:55)
    - cron: '*/5 0-14 * * *'
  workflow_dispatch:      # 手動実行用ボタン
  repository_dispatch:    # GASからの即時起動イベント
    types: [form_submitted]

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests
          playwright install chromium

      - name: Run Hunter
        env:
          CONFIG_CSV_URL: ${{ secrets.CONFIG_CSV_URL }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: python sunrise_hunter.py

      # 📸 エラーや失敗があった場合、撮影されたスクショを自動保存
      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          if-no-files-found: ignore
