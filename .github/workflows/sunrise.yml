name: Sunrise Cancel Hunter

on:
  schedule:
    # 日本時間 5:20〜8:55 (UTC 20:20〜23:55)
    - cron: '*/5 20-23 * * *'
    # 日本時間 9:00〜23:55 (UTC 0:00〜14:55)
    - cron: '*/5 0-14 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [form_submitted]

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ⚡️ [超速チェック] タイムアウト対策＆自動リトライ付き日付判定
      - name: Check Target Date
        id: check_date
        env:
          CONFIG_CSV_URL: ${{ secrets.CONFIG_CSV_URL }}
        run: |
          pip install requests
          python -c '
          import os, sys, csv, time, requests
          from datetime import datetime, timezone, timedelta

          url = os.environ.get("CONFIG_CSV_URL")
          jst = timezone(timedelta(hours=9))
          now_jst = datetime.now(jst)

          is_past_val = "false"

          # 💡 最大3回リトライして通信タイムアウトを回避
          for attempt in range(3):
              try:
                  res = requests.get(url, timeout=15)
                  lines = res.text.splitlines()
                  reader = list(csv.reader(lines))
                  if len(reader) >= 2:
                      latest = reader[-1]
                      raw_date = latest[1].replace("/", "-").strip()
                      parts = raw_date.split("-")
                      if len(parts) == 3:
                          y, m, d = int(parts[0]), int(parts[1]), int(parts[2])
                      elif len(parts) == 2:
                          y, m, d = now_jst.year, int(parts[0]), int(parts[1])
                      else:
                          break
                      
                      target_midnight = datetime(y, m, d, 23, 59, 59, tzinfo=jst)
                      if target_midnight < now_jst:
                          print(f"🛑 乗車日（{m}月{d}日）は過去のためスキップします。")
                          is_past_val = "true"
                      else:
                          print(f"✅ 有効な乗車日（{m}月{d}日）です。監視を継続します。")
                          is_past_val = "false"
                  break
              except Exception as e:
                  print(f"⚠️ 日付確認リトライ中 ({attempt+1}/3): {e}")
                  time.sleep(2)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"is_past={is_past_val}\n")
          '

      # 📦 有効な日付のときだけブラウザをインストール
      - name: Install dependencies
        if: steps.check_date.outputs.is_past == 'false'
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium

      # 🚀 有効な日付のときだけハンターを実行
      - name: Run Hunter
        if: steps.check_date.outputs.is_past == 'false'
        env:
          CONFIG_CSV_URL: ${{ secrets.CONFIG_CSV_URL }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python sunrise_hunter.py

      # 📸 デバッグ用スクショ保存
      - name: Upload Debug Screenshots
        if: steps.check_date.outputs.is_past == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          if-no-files-found: ignore
